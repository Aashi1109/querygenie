services:
  querygenie-client:
    build:
      context: ./client
    image: aashishpal09/querygenie-client:1.0.0
    container_name: querygenie-client
    env_file:
      - ./client/.env.prod
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      querygenie-server:
        condition: service_healthy
    volumes:
      - log-data:/app/logs

  querygenie-server:
    build:
      context: ./server
    image: aashishpal09/querygenie-server:1.0.1
    container_name: querygenie-server
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    restart: on-failure
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy
    #   qdrant:
    #     condition: service_healthy
    # volumes:
    #   - log-data:/app/logs

volumes:
  log-data:
    driver: local
    driver_opts:
      type: none
      device: ./logs
      o: bind
